# git-cliff : le CHANGELOG généré depuis les commits (Conventional Commits, en anglais).
# Utilisé par /release : `git cliff --bumped-version` propose la version, et
# `git cliff --unreleased --tag vX.Y.Z --strip header` rend la section de la release.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "security" %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}**breaking**: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# Groupes de Keep a Changelog, dans leur ordre (le commentaire HTML fixe l'ordre et disparaît au rendu).
# Security : le scope `security` d'un type publié (`fix(security): …`), pas un mot du corps du message.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^(feat|fix|perf|refactor)\\(security\\)", group = "<!-- 5 -->Security" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^(perf|refactor|revert)", group = "<!-- 1 -->Changed" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "^(docs|test|build|ci|chore|style)", skip = true },
]

[bump]
# Avant 1.0, un changement cassant monte le mineur ; ensuite, le majeur. Une feature monte toujours le mineur.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
